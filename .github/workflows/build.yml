name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows App
        run: npm run build

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MyStickyNotes-Windows
          path: dist/*.exe
